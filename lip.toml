format = 4
id = "github.com/MiracleForest/BarelyEnoughItems"
version = "0.1.0"

[info]
name = "BarelyEnoughItems"
description = "A JEI-style item list and recipe viewer for Minecraft Bedrock Edition"
tags = ["utility", "visual", "recipe-viewer", "inventory", "item-list"]
logo = "https://raw.githubusercontent.com/MiracleForest/BarelyEnoughItems/main/docs/logo.png"

# BEI is compiled against one LeviLamina line at a time, so every supported line is a variant
# named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51), 26_60 for 26.60.x
# (Minecraft 1.26.60). Variant names may only hold [a-z0-9_], hence 26_60 and not 26.60.
#
# The default variant is the newest supported line. BEI only runs on the client, so every variant
# has a client entry only. LeviLamina releases are still tooth.json packages, whose client build
# is the variant "client", hence the dependency on LeviLamina#client.

# --- 26.60 (Minecraft 1.26.60) ------------------------------------------------------------------

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/BEI/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bei-client-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BEI/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bei-client-win-x64-ll26.60.zip"]

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/BEI/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bei-client-win-x64-ll26.51.zip"]
